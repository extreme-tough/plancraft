# Firebase App Hosting backend config (deploys on every push to main).
# No secrets are needed: Vertex AI is reached through the backend's service account (ENG-02).

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Names this deployment; with it, the server refuses AI_PROVIDER=fixture (AI-05).
  - variable: APP_ENV
    value: production
    availability: [RUNTIME]
  - variable: AI_PROVIDER
    value: vertex
    availability: [RUNTIME]
  - variable: GEMINI_MODEL
    value: gemini-3.8-flash
    availability: [RUNTIME]
  - variable: GOOGLE_CLOUD_PROJECT
    value: plancraft-96a8f
    availability: [RUNTIME]
  - variable: GOOGLE_CLOUD_LOCATION
    value: global
    availability: [RUNTIME]
  - variable: AI_DAILY_CAP
    value: "2000"
    availability: [RUNTIME]
  # EM-63: only Cloud Scheduler's service account, calling this URL, can reset the demo (docs/setup.md §8).
  - variable: DEMO_RESET_INVOKER
    value: demo-reset@plancraft-96a8f.iam.gserviceaccount.com
    availability: [RUNTIME]
  - variable: DEMO_RESET_AUDIENCE
    value: https://plancraft--plancraft-96a8f.asia-southeast1.hosted.app/api/internal/demo-reset
    availability: [RUNTIME]

  # Firebase web config: public by design, inlined into the browser bundle at build time (ENG-02).
  # The API key is restricted in Google Cloud to the Hosting domains and Firebase APIs (docs/setup.md §4).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAMadTtei9al9zCld-MtMRpncZw3UHzSUQ
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: plancraft-96a8f.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: plancraft-96a8f
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:368367407487:web:8de17a7489b4f29f388a4a
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: plancraft-96a8f.firebasestorage.app
    availability: [BUILD, RUNTIME]
